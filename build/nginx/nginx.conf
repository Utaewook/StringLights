user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Neither extension is in nginx's bundled mime.types (checked against 1.31.2),
    # so both would otherwise fall through to default_type octet-stream.
    types {
        application/javascript mjs;
        application/manifest+json webmanifest;
    }

    # Intake bounds. Nothing limited how many requests arrived at once — only how
    # large each one could be. Surgery is serialised by Semaphore(1) in the backend,
    # so concurrent uploads gain the user nothing while each one spools up to 55M
    # against a container capped at 350M. Sized against the container, not the
    # host's 512MB. See docs/issues/012.
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;
    limit_req_zone  $binary_remote_addr zone=api_req:10m rate=20r/m;
    limit_conn_status 429;
    limit_req_status  429;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Gzip settings for static bundles
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # HTTP -> HTTPS Redirection
    #
    # The ACME challenge path is the one exception to the redirect. Certbot's
    # HTTP-01 authenticator writes its token under /var/www/certbot and Let's
    # Encrypt fetches it over plain HTTP; a blanket 301 makes every renewal fail
    # and the certificate expires 90 days later. The directory is bind-mounted
    # read-only from the host, where certbot writes it.
    server {
        listen 80;
        server_name string-lights.dev;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name string-lights.dev;

        ssl_certificate /etc/letsencrypt/live/string-lights.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/string-lights.dev/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Crucial: Allow uploading zip/onnx files up to 50MB (55MB buffer)
        client_max_body_size 55M;

        # Frontend static files routing
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Enable COOP and COEP for SharedArrayBuffer (ONNX Runtime Web WASM Multithreading)
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }

        # Health is deliberately outside the rate limit. The deploy gate polls it
        # every 2s for up to 60s, and any limit worth setting on the upload path
        # would reject that and fail a good deploy. An exact-match location wins
        # over the /api/ prefix below.
        location = /api/health {
            proxy_pass http://backend:8000/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API proxy routing
        location /api/ {
            limit_conn api_conn 2;
            limit_req  zone=api_req burst=5 nodelay;

            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # API upload timeout extensions
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }
    }
}
