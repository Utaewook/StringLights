services:
  backend:
    build:
      context: ../apps/backend
      dockerfile: ../../build/Dockerfile
    container_name: string_lights_backend
    restart: always
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 350M

  nginx:
    image: nginx:alpine
    container_name: string_lights_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../apps/web-app/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 50M
