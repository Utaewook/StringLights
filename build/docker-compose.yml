services:
  backend:
    build:
      context: ../
      dockerfile: build/backend.Dockerfile
    image: ${DOCKER_REGISTRY:-ghcr.io/utaewook}/string_lights_backend:${DOCKER_TAG:-latest}
    container_name: string_lights_backend
    restart: always
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 350M

  frontend:
    build:
      context: ../
      dockerfile: build/frontend.Dockerfile
    image: ${DOCKER_REGISTRY:-ghcr.io/utaewook}/string_lights_frontend:${DOCKER_TAG:-latest}
    container_name: string_lights_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot's HTTP-01 webroot. nginx only reads it; certbot writes on the host.
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 50M
