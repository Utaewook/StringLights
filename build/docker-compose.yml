services:
  backend:
    build:
      context: ../
      dockerfile: build/backend.Dockerfile
    image: ${DOCKER_REGISTRY:-ghcr.io/utaewook}/string_lights_backend:latest
    container_name: string_lights_backend
    restart: always
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 350M

  frontend:
    build:
      context: ../
      dockerfile: build/frontend.Dockerfile
    image: ${DOCKER_REGISTRY:-ghcr.io/utaewook}/string_lights_frontend:latest
    container_name: string_lights_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 50M
