name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# One deploy at a time per branch. Two pushes in quick succession would
# otherwise race each other onto the same host.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/string_lights_backend
  FRONTEND_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/string_lights_frontend

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Lint
        working-directory: apps/web-app
        run: |
          npm ci
          npm run lint

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    # Only build and push images on 'main' branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Names for Docker
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE_NAME=ghcr.io/${OWNER_LC}/string_lights_backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_NAME=ghcr.io/${OWNER_LC}/string_lights_frontend" >> $GITHUB_ENV
          echo "IMAGE_TAG=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/backend.Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.BACKEND_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/docker-compose.yml"
          target: "~/string_lights/"

      - name: Deploy on Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/string_lights/build

            export DOCKER_REGISTRY=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            # Pin the deploy to the exact image this run built. Resolving
            # :latest on the host would let two deploys race onto different
            # images while both believing they shipped their own build.
            export DOCKER_TAG=sha-$(echo "${{ github.sha }}" | cut -c1-7)
            echo "deploying ${DOCKER_TAG}"

            # GHCR packages are public; no docker login is performed here. If a
            # package is ever made private, this pull is what will start failing.
            docker compose pull

            # --no-build: building on a 512MB host would exhaust it.
            docker compose up -d --no-build

            # Dangling layers only. -a would delete the previous release, which
            # is exactly what a rollback needs to still exist.
            docker image prune -f

            # Verify the real production path: TLS vhost -> nginx -> backend.
            # Probing http://localhost would be worthless: port 80 answers 301
            # for everything but the ACME path, and curl -f treats a 301 as
            # success, so that check would pass with the backend dead.
            i=1
            while [ $i -le 30 ]; do
              if curl -fsS -o /dev/null --max-time 5 \
                   --resolve string-lights.dev:443:127.0.0.1 \
                   https://string-lights.dev/api/health; then
                echo "healthy after $((i * 2))s"
                exit 0
              fi
              sleep 2
              i=$((i + 1))
            done

            echo "deploy is unhealthy 60s after start"
            docker compose ps
            docker compose logs --tail=50
            exit 1
