name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  DOCKER_REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/string_lights_backend
  FRONTEND_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/string_lights_frontend

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Lint
        working-directory: apps/web-app
        run: |
          npm ci
          npm run lint

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    # Only build and push images on 'main' branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Names for Docker
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE_NAME=ghcr.io/${OWNER_LC}/string_lights_backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_NAME=ghcr.io/${OWNER_LC}/string_lights_frontend" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/backend.Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE_NAME }}:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/frontend.Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/docker-compose.yml"
          target: "~/string_lights/"

      - name: Deploy on Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/string_lights/build
            
            # Export environment variable for docker-compose to pick up GHCR image
            export DOCKER_REGISTRY=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            
            # Login to GHCR (Assumes a PAT or token is set in server environment or we can pass it, but for public packages it's not needed. Let's ensure it's a public package in github settings)
            # If the package is private, we need: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest images
            docker compose pull
            
            # Start containers with no-build to prevent memory spike
            docker compose up -d --no-build
            
            # Clean up old unused images to save disk and memory space
            docker image prune -af
