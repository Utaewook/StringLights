<!doctype html>
<html lang="en" class="theme-indigo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Brand mark. The .ico carries 16/32/48, which are the mini variant — the full
         three-bulb mark does not survive below 48px. See docs/design/direction.md. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>String Lights — Web Inference Hub</title>
    <meta
      name="description"
      content="Replay an ONNX forward pass node by node, in your browser. Your model never leaves your machine."
    />
    <script>
      // Applies the stored colour mode before first paint so the page does not flash.
      // Mirrors src/utils/theme.ts — keep the storage key in step.
      (function () {
        try {
          var stored = localStorage.getItem('stringlights-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage blocked — fall through to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
